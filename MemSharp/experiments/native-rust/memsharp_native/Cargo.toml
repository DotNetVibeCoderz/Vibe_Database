[package]
name = "memsharp_native"
version = "0.1.0"
edition = "2021"
publish = false
description = "Experiment: what a Rust native layer would and would not buy MemSharp. Not shipped."

[lib]
crate-type = ["cdylib"]

[dependencies]
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
