# MemSharp - publish to NuGet on a version tag.
#
# This file lives at the ROOT of the Vibe_Database repository: GitHub Actions only reads workflows
# from the root, and silently ignores ones nested in a project subdirectory.
#
#   git tag memsharp-v1.0.0
#   git push origin memsharp-v1.0.0
#
# Tags are namespaced rather than bare `v1.0.0` because this is a monorepo: a bare version tag would
# be ambiguous about which project it releases, and would fire every project's release workflow.

name: MemSharp Release

on:
  push:
    tags: ['memsharp-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack without publishing'
        type: boolean
        default: true

permissions:
  contents: write

env:
  PROJECT_DIR: MemSharp
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}

    defaults:
      run:
        working-directory: MemSharp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: MemSharp/global.json

      # The version guard matters more than it looks: a published NuGet version is immutable, so a
      # package whose tag disagrees with its assembly version cannot be corrected afterwards.
      - name: Resolve and check the version
        id: resolve
        run: |
          # POSIX sed, not `grep -oP`: -P needs a PCRE-enabled grep and a compatible locale, and
          # when either is missing it prints nothing, leaving `declared` empty. The comparison below
          # would then fail for a reason its error message does not explain, so the symptom would be
          # a release that can never succeed. The emptiness check makes that failure legible.
          declared=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' Directory.Build.props | head -1)

          if [ -z "$declared" ]; then
            echo "::error::could not read <Version> from MemSharp/Directory.Build.props"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            tagged="${GITHUB_REF_NAME#memsharp-v}"
            if [ "$tagged" != "$declared" ]; then
              echo "::error::tag says $tagged but Directory.Build.props says $declared"
              exit 1
            fi
          fi

          echo "version=$declared" >> "$GITHUB_OUTPUT"
          echo "releasing $declared"

      - name: Test
        run: dotnet test tests/MemSharp.Tests/MemSharp.Tests.csproj -c Release

      - name: Pack
        run: dotnet pack -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: MemSharp/artifacts/packages/*
          if-no-files-found: error

  publish:
    name: publish to NuGet
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.dry_run == false

    # Requires a human approval even though pushing a tag does not. Create the environment under
    # Settings -> Environments with required reviewers.
    environment: nuget

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: packages

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Push
        run: |
          dotnet nuget push 'packages/*.nupkg' \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  release:
    name: GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: packages

      - uses: softprops/action-gh-release@v2
        with:
          name: MemSharp ${{ needs.verify.outputs.version }}
          files: packages/*
          body: |
            MemSharp ${{ needs.verify.outputs.version }} - by Gravicode Studios, led by Kang Fadhil.

            ```
            dotnet add package MemSharp
            dotnet tool install -g MemSharp.Cli
            ```

            See [the documentation](https://github.com/DotNetVibeCoderz/Vibe_Database/tree/main/MemSharp).
          generate_release_notes: true
