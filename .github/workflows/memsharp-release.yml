# MemSharp - publish to NuGet, PyPI and npm on a version tag.
#
# This file lives at the ROOT of the Vibe_Database repository: GitHub Actions only reads workflows
# from the root, and silently ignores ones nested in a project subdirectory.
#
#   git tag memsharp-v1.0.0
#   git push origin memsharp-v1.0.0
#
# Tags are namespaced rather than bare `v1.0.0` because this is a monorepo: a bare version tag would
# be ambiguous about which project it releases, and would fire every project's release workflow.

name: MemSharp Release

on:
  push:
    tags: ['memsharp-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack without publishing'
        type: boolean
        default: true

permissions:
  contents: write

env:
  PROJECT_DIR: MemSharp
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}

    defaults:
      run:
        working-directory: MemSharp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: MemSharp/global.json

      # The version guard matters more than it looks: a published NuGet version is immutable, so a
      # package whose tag disagrees with its assembly version cannot be corrected afterwards.
      - name: Resolve and check the version
        id: resolve
        run: |
          # POSIX sed, not `grep -oP`: -P needs a PCRE-enabled grep and a compatible locale, and
          # when either is missing it prints nothing, leaving `declared` empty. The comparison below
          # would then fail for a reason its error message does not explain, so the symptom would be
          # a release that can never succeed. The emptiness check makes that failure legible.
          declared=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' Directory.Build.props | head -1)

          if [ -z "$declared" ]; then
            echo "::error::could not read <Version> from MemSharp/Directory.Build.props"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            tagged="${GITHUB_REF_NAME#memsharp-v}"
            if [ "$tagged" != "$declared" ]; then
              echo "::error::tag says $tagged but Directory.Build.props says $declared"
              exit 1
            fi
          fi

          echo "version=$declared" >> "$GITHUB_OUTPUT"
          echo "releasing $declared"

      - name: Test
        run: dotnet test tests/MemSharp.Tests/MemSharp.Tests.csproj -c Release

      - name: Pack
        run: dotnet pack -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: MemSharp/artifacts/packages/*
          if-no-files-found: error

      # The client packages carry their own version numbers. A tag that moves the .NET packages
      # but not the clients would publish a NuGet release while PyPI and npm silently skipped it
      # as a duplicate, so the guard covers all three files.
      - name: Check the client versions agree
        run: |
          declared="${{ steps.resolve.outputs.version }}"
          python_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p'  clients/python/pyproject.toml | head -1)
          node_version=$(node -p "require('./clients/nodejs/package.json').version")
          for pair in "python:$python_version" "nodejs:$node_version"; do
            if [ "${pair#*:}" != "$declared" ]; then
              echo "::error::clients/${pair%%:*} declares ${pair#*:} but Directory.Build.props declares $declared"
              exit 1
            fi
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the Python client
        run: |
          python -m pip install --upgrade build
          python -m build clients/python --outdir clients-dist/python

      - name: Pack the Node.js client
        run: |
          mkdir -p clients-dist/nodejs
          (cd clients/nodejs && npm pack --pack-destination ../../clients-dist/nodejs)

      - uses: actions/upload-artifact@v4
        with:
          name: clients
          path: MemSharp/clients-dist/*
          if-no-files-found: error

  publish:
    name: publish to NuGet
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.dry_run == false

    # Requires a human approval even though pushing a tag does not. Create the environment under
    # Settings -> Environments with required reviewers.
    environment: nuget

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: packages

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Push
        run: |
          dotnet nuget push 'packages/*.nupkg' \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  # The client registries are separate jobs, not steps of the NuGet one: a failure on PyPI or npm
  # must not stop the .NET packages or the GitHub release, and a rerun of one registry must not
  # re-push the others. Each skips with a notice, rather than failing, when its token is absent.
  publish-pypi:
    name: publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.dry_run == false
    environment: nuget

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clients
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upload
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::notice::PYPI_API_TOKEN is not set; skipping PyPI"
            exit 0
          fi
          python -m pip install --upgrade twine
          python -m twine upload --skip-existing dist/python/*

  publish-npm:
    name: publish to npm
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.dry_run == false
    environment: nuget

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clients
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # npm refuses a token that needs a one-time password with EOTP. A CI publish needs an
      # "Automation" token (classic) or a granular token with "bypass 2FA" enabled; the message
      # below says so, because npm's own error does not mention either.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN is not set; skipping npm"
            exit 0
          fi
          set -o pipefail   # GitHub's default bash -e has no pipefail; without it, tee would hide npm's failure
          tarball=$(ls dist/nodejs/*.tgz)
          name=$(tar -xOzf "$tarball" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0)).name")
          version=$(tar -xOzf "$tarball" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version is already on npm; skipping"
            exit 0
          fi
          if ! npm publish "$tarball" --access public 2>&1 | tee npm.log; then
            if grep -q EOTP npm.log; then
              echo "::error::npm asked for a one-time password. NPM_TOKEN must be an Automation token, or a granular token with 'bypass 2FA'. To publish this version by hand: npm publish $tarball --otp=<code>"
            fi
            exit 1
          fi

  release:
    name: GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: packages

      - uses: softprops/action-gh-release@v2
        with:
          name: MemSharp ${{ needs.verify.outputs.version }}
          files: packages/*
          body: |
            MemSharp ${{ needs.verify.outputs.version }} - by Gravicode Studios, led by Kang Fadhil.

            ```
            dotnet add package MemSharp
            dotnet tool install -g MemSharp.Cli
            pip install memsharp
            npm install memsharp
            ```

            See [the documentation](https://github.com/DotNetVibeCoderz/Vibe_Database/tree/main/MemSharp).
          generate_release_notes: true
