name: CuteDB CI

# Only CuteDB's own paths, because this lives in a monorepo alongside FAISS.Net and MemSharp and a
# change to one project should not spend twenty minutes rebuilding the others.
on:
  push:
    branches: [main]
    paths:
      - 'CuteDB/**'
      - '.github/workflows/cutedb-ci.yml'
  pull_request:
    paths:
      - 'CuteDB/**'
      - '.github/workflows/cutedb-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: CuteDB

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ---------------------------------------------------------------------------------------------
  # The Rust accelerator, built first so the .NET job can test against it. It is optional at
  # runtime, but a CI run that never loads it would let the parity suite pass vacuously.
  # ---------------------------------------------------------------------------------------------
  native:
    name: native (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,    target: x86_64-pc-windows-msvc }
          - { os: ubuntu-latest,  rid: linux-x64,  target: x86_64-unknown-linux-gnu }
          - { os: macos-latest,   rid: osx-arm64,  target: aarch64-apple-darwin }
          - { os: macos-latest,   rid: osx-x64,    target: x86_64-apple-darwin }

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: CuteDB/native

      - name: Format
        working-directory: CuteDB/native
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: CuteDB/native
        run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Test
        working-directory: CuteDB/native
        # Cross-compiled targets cannot run their own tests; the host target covers them.
        if: matrix.rid != 'osx-x64'
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build
        shell: bash
        run: ./native/build.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: CuteDB/native/artifacts/${{ matrix.rid }}/
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------
  # The .NET solution, on all three platforms. Runs twice on each: once with the accelerator and
  # once without, because "the managed path still works" is a promise the README makes.
  # ---------------------------------------------------------------------------------------------
  dotnet:
    name: dotnet (${{ matrix.os }})
    needs: native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest,  rid: linux-x64 }
          - { os: macos-latest,   rid: osx-arm64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: CuteDB/global.json

      - name: Download the accelerator
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: CuteDB/native/artifacts/${{ matrix.rid }}/

      - name: Restore
        run: dotnet restore CuteDB.slnx

      - name: Build
        run: dotnet build CuteDB.slnx -c Release --no-restore

      - name: Test with the native scanner
        # CUTEDB_EXPECT_NATIVE makes the parity suite's canary strict: without it a build that
        # quietly stopped loading the library would compare managed against managed and pass.
        env:
          CUTEDB_EXPECT_NATIVE: '1'
        run: dotnet test tests/CuteDB.Tests -c Release --no-build --logger "console;verbosity=normal"

      - name: Test the CLI
        # The real command tree, driven in-process: seed, query in every format, explain, the index
        # commands, error exits, and export -> import round trips through JSON, JSON Lines and CSV.
        run: dotnet test tests/CuteDB.Cli.Tests -c Release --no-build --logger "console;verbosity=normal"

      - name: Test without it
        # The managed engine has to give identical answers on its own. Turning the accelerator off
        # is the only way to prove the fallback is real rather than theoretical.
        env:
          CUTEDB_DISABLE_NATIVE: '1'
        run: dotnet test tests/CuteDB.Tests -c Release --no-build --filter "FullyQualifiedName!~NativeParityTests"

      - name: Test the server
        # The real application — ServerHost, middleware, routes — hosted in memory, so the HTTP
        # contract the three clients depend on is checked on every platform, not only by the
        # Linux-only smoke run below.
        run: dotnet test tests/CuteDB.Server.Tests -c Release --no-build --logger "console;verbosity=normal"

      - name: Test CuteDB Browser
        # Headless, so it needs no display: statement splitting, the LINQ script host, every
        # template run against the Retail seed, settings round-trips, and Jack's tool schemas
        # including the proof that no tool can write.
        run: dotnet test tests/CuteBrowser.Tests -c Release --no-build --logger "console;verbosity=normal"

      - name: Render the demo screenshots
        # Headless, so it works with no display. This is also the only check that every view in the
        # demo actually builds and lays out.
        run: dotnet run --project samples/CuteDB.Demo -c Release --no-build -- --screenshot artifacts/screenshots

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: screenshots
          path: CuteDB/artifacts/screenshots/

  # ---------------------------------------------------------------------------------------------
  # The three client libraries. Each has unit tests that stub the transport, and then all three run
  # against a real server so the wire format is checked rather than assumed.
  # ---------------------------------------------------------------------------------------------
  clients:
    name: clients
    needs: native
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: CuteDB/global.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: CuteDB/clients/go/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download the accelerator
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: CuteDB/native/artifacts/linux-x64/

      - name: Python unit tests
        working-directory: CuteDB/clients/python
        run: python -m unittest discover -s tests -v

      - name: Go vet and unit tests
        working-directory: CuteDB/clients/go
        run: |
          go vet ./...
          go test ./... -v

      - name: Node unit tests
        working-directory: CuteDB/clients/nodejs
        run: npm test

      - name: Build and seed a database
        run: |
          dotnet build src/CuteDB.Cli -c Release
          dotnet build src/CuteDB.Server -c Release
          dotnet run --project src/CuteDB.Cli -c Release --no-build -- \
            seed /tmp/ci.cute --scale tiny --quiet

          # The built tool against a real file, on top of the in-process tests: an indexed path
          # has to plan as a seek, and a write has to be refused rather than run.
          dotnet run --project src/CuteDB.Cli -c Release --no-build -- \
            explain /tmp/ci.cute "SELECT * FROM orders WHERE address.city = 'Bandung'" \
            --analyze --format json | tee /tmp/plan.json
          grep -q '"strategy": "Index seek"' /tmp/plan.json
          if dotnet run --project src/CuteDB.Cli -c Release --no-build -- \
              explain /tmp/ci.cute "DELETE FROM orders" --quiet; then
            echo "explain ran a DELETE"; exit 1
          fi

      - name: Start the server
        run: |
          # The built binary rather than `dotnet run`, under nohup so it survives this step
          # ending. A `dotnet run` child can be reaped along with the step's shell, which turns a
          # startup problem into a confusing connection error two steps later.
          nohup ./src/CuteDB.Server/bin/Release/net10.0/CuteDB.Server \
            /tmp/ci.cute --port 8420 --quiet > /tmp/server.log 2>&1 &
          disown

          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8420/health > /dev/null; then
              echo "server is up"
              exit 0
            fi
            sleep 1
          done

          echo "server did not start; log follows"
          cat /tmp/server.log
          exit 1

      - name: End-to-end, all three clients
        run: ./.github/scripts/client-smoke.sh

  # ---------------------------------------------------------------------------------------------
  # Packing is checked on every run, so a packaging break is found on the PR that caused it rather
  # than on release day.
  # ---------------------------------------------------------------------------------------------
  pack:
    name: pack
    needs: [native, dotnet]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: CuteDB/global.json

      - name: Download every accelerator build
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: CuteDB/native/artifacts/
          merge-multiple: false

      - name: Flatten the artifact layout
        # download-artifact nests each one under its artifact name; the csproj expects
        # native/artifacts/<rid>/.
        working-directory: CuteDB/native/artifacts
        run: |
          for dir in native-*; do
            [ -d "$dir" ] || continue
            rid="${dir#native-}"
            mkdir -p "$rid"
            mv "$dir"/* "$rid"/ 2>/dev/null || true
            rmdir "$dir" 2>/dev/null || true
          done
          ls -R

      - name: Pack
        run: dotnet pack CuteDB.slnx -c Release -o artifacts/packages

      - name: Show what is in the package
        run: |
          cd artifacts/packages
          ls -la
          for nupkg in CuteDB.2*.nupkg CuteDB.Browser.2*.nupkg; do
            echo "--- $nupkg ---"
            unzip -l "$nupkg" | grep -E 'runtimes/[^/]+/native|lib/' || true
          done

      - name: Install the browser tool and start it
        # The same check the release runs: the package installs as a tool, finds its settings,
        # and loads the accelerator from runtimes/linux-x64/native inside the tool store.
        run: |
          version=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)
          printf '<configuration><packageSources><clear /><add key="local" value="%s" /></packageSources></configuration>\n' \
            "$PWD/artifacts/packages" > /tmp/browser-nuget.config

          dotnet tool install --tool-path /tmp/browser-tool --configfile /tmp/browser-nuget.config \
            CuteDB.Browser --version "$version"
          CUTEBROWSER_CONFIG=/tmp/browser-tool-settings.config /tmp/browser-tool/cutebrowser --help | tee /tmp/browser-help.txt
          if ! grep -q "accelerator : cutedb_core" /tmp/browser-help.txt; then
            echo "::error::The installed browser tool did not load the native accelerator."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: CuteDB/artifacts/packages/*.nupkg
